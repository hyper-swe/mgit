# mgit GoReleaser configuration
# Triggered by: git tag v*.*.* && goreleaser release
version: 2

project_name: mgit

before:
  hooks:
    - go mod tidy
    # The darwin daemon links libkrun (the GA default backend), and libkrun
    # gates its net API behind an opt-in build flag. A library without it
    # cannot host a sandbox at all, so fail the RELEASE rather than ship a
    # daemon that refuses to start on every user's Mac. Refs: MGIT-61.14
    - make check-libkrun-net
    - go test ./... -count=1

builds:
  - id: mgit
    main: ./cmd/mgit/
    binary: mgit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1

  # mgit-sandboxd (Linux): the per-task microVM daemon (FR-17.16). On Linux
  # it is PURE Go — firecracker is launched as a subprocess and the vzf
  # (macOS) backend compiles to its unavailable stub off darwin — so it
  # cross-builds CGO-free on the same ubuntu runner as mgit. It has no
  # version vars, so it takes only -s -w. Refs: MGIT-44, FR-17.16
  - id: mgit-sandboxd-linux
    main: ./cmd/mgit-sandboxd/
    binary: mgit-sandboxd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1

  # mgit-sandboxd (macOS, arm64): the vzf backend needs CGO +
  # Virtualization.framework, and the framework refuses to start a VM unless
  # the binary carries com.apple.security.virtualization. So this build is
  # CGO-enabled and native-only — the whole release therefore runs on a macos
  # (Apple Silicon) runner, from which the CGO-free mgit and linux daemon
  # cross-compile fine. A per-build post hook ad-hoc entitlement-signs the
  # binary in place before it is archived. arm64 only: the backend is
  # validated on Apple Silicon; Intel macs run core mgit without the sandbox
  # (like Windows).
  #
  # BACKEND: libkrun, the GA default on macOS (ADR-010). It is no longer
  # behind a build tag, so this build LINKS libkrun and the release runner
  # must have it installed (`brew tap libkrun/krun && brew install libkrun`)
  # with networking enabled — the before-hook checks that. macOS 14+ floor.
  # vzf remains in the tree behind `-tags vzf` and is not shipped.
  # Refs: MGIT-44, FR-17.15, ADR-010, MGIT-61.14
  - id: mgit-sandboxd-darwin
    main: ./cmd/mgit-sandboxd/
    binary: mgit-sandboxd
    env:
      - CGO_ENABLED=1
      # libkrun ships its own pkg-config; Homebrew does not put it on the
      # default search path.
      - 'PKG_CONFIG_PATH={{ if index .Env "PKG_CONFIG_PATH" }}{{ .Env.PKG_CONFIG_PATH }}{{ else }}/opt/homebrew/opt/libkrun/lib/pkgconfig{{ end }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      post:
        # Ad-hoc sign (identity "-") with the hypervisor entitlements. The
        # plist carries BOTH com.apple.security.hypervisor (libkrun/HVF) and
        # com.apple.security.virtualization (vzf) — one binary, either
        # backend. Neither is restricted, so neither needs notarization to be
        # HONORED once the binary runs.
        #
        # THAT IS NOT THE SAME AS BEING ALLOWED TO RUN. Gatekeeper is a
        # separate mechanism: on Apple Silicon a DOWNLOADED file carries
        # com.apple.quarantine, and a quarantined ad-hoc-signed binary is
        # SIGKILLed on exec — no dialog, just "killed" (MGIT-64, reproduced on
        # a second Mac). `go install` and Homebrew are unaffected (neither
        # quarantines), so the exposed path is a direct archive download.
        # Making that Just Work needs real notarization (Developer ID +
        # notarytool + staple), which is an owner decision, not something this
        # hook can fix. Do not read "no notarization needed" here as "the
        # download works".
        #
        # This also covers the re-exec VM child, which IS this binary
        # (ADR-010): the entitlement attaches to the signed path, so the
        # child inherits it by construction. Refs: MGIT-44, MGIT-64, FR-17.15, MGIT-61.8
        - cmd: codesign --force --sign - --entitlements build/darwin/vz.entitlements "{{ .Path }}"

  # mgit-guest: the in-guest supervisor that runs as PID 1 inside every
  # sandbox. It is guest-only — never installed on a host PATH — and a host
  # install carries no Go toolchain and no mgit source, so without shipping it
  # here `mgit sandbox base from debian:12` could not compose a base at all.
  #
  # Built with the same reproducible flags the in-tree cross-build uses
  # (-trimpath, no VCS stamp, no build ID), so a base composed from a release
  # install and one composed from source pin to the same tree digest.
  # Refs: MGIT-61.15, FR-17.11
  - id: mgit-guest
    main: ./cmd/mgit-guest/
    binary: mgit-guest
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1

archives:
  - id: mgit-archive
    # Each per-(os,arch) archive folds in every referenced build that
    # targets it: linux archives get mgit + the linux daemon; darwin/arm64
    # gets mgit + the signed daemon; darwin/amd64 and windows get mgit only
    # (no sandbox backend there). mgit resolves mgit-sandboxd next to its own
    # binary, so shipping them in one archive is what makes the sandbox work.
    ids:
      - mgit
      - mgit-sandboxd-linux
      - mgit-sandboxd-darwin
    # Expected and intended: Linux and macOS-arm64 archives carry two binaries
    # (mgit + mgit-sandboxd); Windows and Intel-macOS archives carry mgit only,
    # because there is no sandbox backend there. Refs: MGIT-44
    allow_different_binary_count: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # The guest pair, laid out where `mgit sandbox base` looks for it: a
    # guest/ directory beside the host binary. Only the archive's OWN
    # architecture is shipped — libkrun uses hardware virtualization, so the
    # guest architecture always equals the host's and a second copy would be
    # dead weight. That is also why the destination needs no architecture in
    # its name (and could not carry one: goreleaser templates `src` here but
    # NOT `dst` — a `{{ .Arch }}` in dst ships literally, verified against a
    # snapshot build). The linux `mgit` comes from the existing linux build of
    # the CLI; the guest runs the same CLI the host does. Refs: MGIT-61.15
    files:
      # goreleaser ships LICENSE/README/CHANGELOG by default, and declaring
      # `files` REPLACES that default rather than adding to it — so they have
      # to be named here or an Apache-2.0 product ships with no license text.
      - LICENSE*
      - README*
      - CHANGELOG*
      - src: "dist/mgit-guest_linux_{{ .Arch }}*/mgit-guest"
        dst: "guest/"
        strip_parent: true
      - src: "dist/mgit_linux_{{ .Arch }}*/mgit"
        dst: "guest/"
        strip_parent: true

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: hyper-swe
    name: mgit
  draft: false
  prerelease: auto
  name_template: "mgit {{.Tag}}"
  header: |
    ## mgit — a sandboxed, checkpointed working substrate for LLM coding agents

    mgit gives a coding agent two things together: **containment** — its untrusted code (npm/pip installs, builds, tests) runs in a disposable per-task microVM, not on your machine — and a **checkpointed working substrate** — every step is a task-tagged micro-commit in an isolated `.mgit` store that never touches your real `.git`, so you review and land only the squashed result.

    > **Beta.** The microVM sandbox is the differentiator; it is live-validated on Linux (firecracker/KVM) and macOS (Apple Virtualization.framework, arm64). Windows runs core mgit without the sandbox. See **Known limitations** in the [CHANGELOG](https://github.com/hyper-swe/mgit/blob/main/CHANGELOG.md).

    ### Highlights

    - **Per-task microVM containment** — installs/builds/tests run in a disposable, hardware-isolated VM; a poisoned dependency burns the VM, not your host. Default-deny per-task egress allowlist; verified land (dual-hash + task binding + host-anchored attestation) through an airlock.
    - **`mgit work`** — one command starts an agent on a task: a task-bound worktree with the agent's shell wired through `mgit run` into the sandbox.
    - **Runs over your existing git repo** — a self-contained `.mgit` store; your project's `.git` is provably never mutated, and the base stays in sync with your local working state automatically (no manual sync).
    - **Checkpointed, reviewable history** — task-tagged micro-commits; backtrack / fork / cherry-pick to course-correct; `squash --to-git | git apply` lands a byte-for-byte patch.
    - **Multi-agent worktree isolation**, **REST + MCP** integration surfaces, dual-hash integrity, append-only audit.
    - **Pure Go, zero CGO** — single static binary (Linux, macOS, Windows; amd64 + arm64).

    ### Quality

    - 530+ automated tests, race-detector clean under `-race`, zero lint warnings.

    ### Install

    Each archive below ships **two** host binaries: `mgit` and, where a
    sandbox backend exists (Linux and macOS arm64), the `mgit-sandboxd`
    daemon next to it. Homebrew installs both.

    ```bash
    # Homebrew (installs mgit + mgit-sandboxd)
    brew install hyper-swe/tap/mgit

    # Go — core mgit
    go install github.com/hyper-swe/mgit/cmd/mgit@latest

    # Go — the sandbox daemon (Linux works out of the box; on macOS the
    # go-installed binary is unsigned and needs the virtualization
    # entitlement — prefer brew or the release archive there)
    go install github.com/hyper-swe/mgit/cmd/mgit-sandboxd@latest

    # Binary — download the archive below for your platform (contains both)
    ```

    The microVM sandbox also needs a guest image; see
    [docs/INSTALL-SANDBOX.md](https://github.com/hyper-swe/mgit/blob/main/docs/INSTALL-SANDBOX.md).

    ### Pairs with [mtix](https://github.com/hyper-swe/mtix)

    mgit + mtix form a closed loop for enterprise AI-driven development: mtix tracks *what to build*, mgit tracks *what was built*. Task IDs flow between both systems. The unit of failure is a task, not a session.
