name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Re-run the post-publish smoke against an ALREADY-PUBLISHED tag. Without
  # this the only way to exercise it is to cut another release, which is how a
  # broken gate stays broken. Refs: MGIT-84
  workflow_dispatch:
    inputs:
      tag:
        description: "published tag to smoke (e.g. v0.4.4); skips build+publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  # Pin the toolchain to the one setup-go installs, and forbid Go from
  # downloading another. Without this, go.mod's `toolchain` directive makes
  # Go fetch golang.org/toolchain AS A MODULE into the module cache; setup-go
  # then caches that directory, and the next run's restore collides with the
  # toolchain setup-go itself installed -- `gtar: Cannot open: File exists`,
  # which is a hard job failure. Keep this in step with go.mod's toolchain
  # line and the go-version pins below. Refs: MGIT-118
  GOTOOLCHAIN: local

jobs:
  preflight:
    name: Preflight Checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Verify Go modules
        run: go mod verify

      - name: Run tests with race detector
        run: go test ./... -race -count=1

      - name: Run linter
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.3

      - name: Run vulnerability check
        run: |
          # The install is a proxy.golang.org fetch; the scan that follows is
          # local. -t 120 is the floor (worst success 19s, n=136).
          # Refs: MGIT-143
            # pin-exempt: govulncheck floats on purpose — a pinned scanner stops finding new vulnerabilities; the fetch is guarded (MGIT-143) and the float is a recorded decision (MGIT-179)
          bash scripts/ci/guard-fetch.sh -t 120 -l govulncheck-install \
            -c none:'the module cache writes each download to a temp path and renames it only after verifying the checksum, so a failed fetch leaves nothing behind for the next attempt to trip over' -- \
            go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test coverage
        run: make test-cover

      - name: Anti-stub check
        run: |
          if grep -rn '"not yet implemented"\|"not implemented"\|"integration pending"' \
            --include='*.go' --exclude='*_test.go' .; then
            echo "FAIL: stubs found"
            exit 1
          fi

  # The whole release runs on an Apple Silicon runner. The macOS sandbox
  # daemon needs CGO + Virtualization.framework and can only be built (and
  # entitlement-signed) natively on a mac; the CGO-free mgit and Linux daemon
  # cross-compile from there. This is the OSS-goreleaser way to ship a CGO
  # darwin binary in the same run as the cross-built targets. Refs: MGIT-44
  # Install-channel + posture e2e as a release gate (MGIT-48): a regression like
  # "sandboxd missing from archives" or "an MCP tool returns placeholder" fails
  # the release before users see it. Reuses the standalone e2e workflow.
  e2e:
    name: e2e gate
    needs: preflight
    uses: ./.github/workflows/e2e.yml

  release:
    name: Release
    needs: [preflight, e2e]
    runs-on: macos-14 # Apple Silicon — builds+signs the darwin daemon natively
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: v2.4.1

      # goreleaser's before-hook tests link this runner's libkrun and run
      # `make check-libkrun-net` against it; the darwin daemon that ships
      # carries its own (e2e.yml's darwin-sandboxd job, MGIT-259). Both
      # need the library present on this runner.
      #
      # This used to be the same three commands as ci.yml's libkrun job with
      # the retry left off, so the 2026-08-15 bottle-CDN outage that ci.yml
      # absorbed would still have taken a RELEASE down -- the guard protecting
      # the cheap job and not the expensive one. One script now, three call
      # sites, all three clauses.
      # Refs: MGIT-143, MGIT-119, MGIT-61.14, MGIT-61.8, ADR-010
      - name: Install libkrun (bottled)
        run: bash scripts/ci/install-libkrun-brew.sh

      # The Linux daemons and the kernel's corresponding source, built by the
      # e2e gate's linux-sandboxd job IN THIS RUN — stamped with this tag, and
      # the same bytes that gate's Linux user-path leg just booted a guest
      # with. goreleaser takes the daemons through
      # scripts/release/gobinary-prebuilt.sh (verified against their manifests
      # and this release's stamps) and publishes the sources under the signed
      # checksums. Refs: MGIT-229
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-sandboxd-*
          path: dist-prebuilt
          merge-multiple: true
      # The macOS daemon, from the same gate's darwin-sandboxd job. Carry a
      # patched libkrun in the macOS build; fixes MGIT-225. Refs: MGIT-259
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: darwin-sandboxd-*
          path: dist-prebuilt
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-sources
          path: dist-sources
        with:
          name: linux-sources
          path: dist-sources

      # goreleaser CGO-builds + entitlement-signs the darwin daemon (post
      # hook in .goreleaser.yaml) and cross-builds the rest.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # PINNED for the same reason as e2e.yml's install, and this is the
          # site that matters most: `latest` here resolves at RELEASE time,
          # after the tag is pushed — and a failed publish burns the number
          # (R-H298). An unpinned build tool on the release path is a version
          # nobody chose deciding whether a release exists. Refs: MGIT-179
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MGIT_LINUX_PREBUILT: ${{ github.workspace }}/dist-prebuilt
          MGIT_DARWIN_PREBUILT: ${{ github.workspace }}/dist-prebuilt

      - name: Sign checksums
        run: cosign sign-blob --yes --bundle checksums.txt.bundle dist/checksums.txt
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Upload signature
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: checksums.txt.bundle

      - name: Generate build environment
        run: |
          cat > dist/BUILD-ENVIRONMENT.json <<ENVEOF
          {
            "go_version": "$(go version | awk '{print $3}')",
            "tag": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          ENVEOF

      - name: Upload build environment
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/BUILD-ENVIRONMENT.json

  release-smoke:
    name: Post-publish smoke (published archive)
    # `always()` so a manual dispatch runs it with the build jobs skipped, while
    # a tag push still waits for the release it is meant to verify.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    needs: release
    # A FRESH macOS runner: this job must not be the machine that built the
    # release, because the whole point is exercising what a user who downloads
    # the archive gets. Each job gets its own runner, so `needs: release` gives
    # us exactly that. Refs: MGIT-84, MGIT-64, MGIT-65
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Install Homebrew's libkrun and libkrunfw, as a user does: the daemon
      # must still resolve the archive's own libkrun (MGIT-259), and libkrunfw
      # must load. Before MGIT-259 a daemon without libkrun could not load at
      # all, and the liveness, build-agreement and NET=1 checks all skipped --
      # a gate that skips its most important assertions is barely a gate. The third of the three call
      # sites that used to be three near-identical copies of these commands.
      # Refs: MGIT-143, MGIT-84, MGIT-75, MGIT-61.14
      - name: Install libkrun (so the daemon is testable)
        run: bash scripts/ci/install-libkrun-brew.sh
      # The script downloads the just-published archive itself, so nothing here
      # can accidentally test a locally built binary -- the mistake that let the
      # quarantine defect ship once already.
      - name: Release smoke against the published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # MGIT_SMOKE_QUARANTINE is deliberately NOT set. The Gatekeeper
          # kill-path cannot be exercised on a hosted runner: it reports
          # `spctl --status: assessments enabled` and still RUNS a quarantined
          # ad-hoc-signed binary, so the check concluded twice that notarization
          # had landed when it had not. Two different gates failed to make it
          # meaningful here. It is a real-Mac step (checklist step 7), and a
          # check that cannot be trusted is worse than one that is absent.
          # STREAM the output, do not capture it. `out="$(...)"` under `bash -e`
          # exits AT THE ASSIGNMENT when the script fails, so the echo never runs
          # and the log shows nothing but "exit code 1" -- which is what happened
          # on this job's first real run. A diagnostic gate that hides its
          # diagnostics is worse than no gate.
          set -o pipefail
          bash scripts/e2e/release_smoke.sh "${{ inputs.tag || github.ref_name }}" 2>&1 \
            | tee "$RUNNER_TEMP/smoke.log" || true
          # A skip must never read as a pass -- the recurring failure this whole
          # gate exists to prevent. Assert the PASS line, then fail on any SKIP
          # that a hosted runner should not have produced.
          grep -q 'RELEASE SMOKE: PASS' "$RUNNER_TEMP/smoke.log" || {
            echo "::error::release smoke did not report PASS (see the streamed output above)"; exit 1; }
          if grep -q 'SKIP: not macOS' "$RUNNER_TEMP/smoke.log"; then
            echo "::error::ran on a non-macOS runner; the darwin checks did not run"; exit 1
          fi
          # libkrun is installed above, so these three MUST have run. Letting
          # them skip silently is how a gate quietly stops checking anything.
          for must in 'mgit-sandboxd ran' 'both binaries report one build' \
                      'krun_add_net_unixgram' 'libkrun resolves inside the archive'; do
            grep -q "$must" "$RUNNER_TEMP/smoke.log" || {
              echo "::error::expected check did not run: $must"; exit 1; }
          done

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: hyper-swe/homebrew-tap
          event-type: release-published
          client-payload: '{"tag": "${{ github.ref_name }}", "project": "mgit"}'
