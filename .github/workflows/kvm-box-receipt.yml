# The KVM box's capability as a CI receipt (MGIT-202).
#
# The box is a self-hosted runner for this PUBLIC repository, addressed by
# the label in the repository variable KVM_RUNNER_LABEL and by nothing else.
# This workflow has exactly one trigger, workflow_dispatch, so no pull
# request — from a fork or otherwise — can run its code on the box; the
# repository's fork-PR policy is "require approval for all outside
# collaborators" as the second wall. It checks nothing out and holds no
# token: the one step prints what the LIVE sandbox legs need from the
# machine, so the box's capability is a run anyone can read rather than an
# assumption. Nothing it prints identifies the machine on the network.
name: kvm-box-receipt

on:
  workflow_dispatch:

permissions: {}

jobs:
  receipt:
    name: The KVM box's capability
    runs-on: ${{ vars.KVM_RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 5
    steps:
      - name: Print the box's capability
        shell: bash
        run: |
          set -u
          echo "== ls -l /dev/kvm =="; ls -l /dev/kvm
          echo "== nproc ==";         nproc
          echo "== free -g ==";       free -g
          echo "== uname -r ==";      uname -r
          echo "== runner uid ==";    id -u
          if test -r /dev/kvm -a -w /dev/kvm; then echo "/dev/kvm: readable and writable by this uid"; else echo "/dev/kvm: NOT accessible by this uid"; fi
          echo "== sudo ==";          if sudo -n true 2>/dev/null; then echo "passwordless sudo: yes"; else echo "passwordless sudo: no"; fi
          echo "== docker ==";        docker --version 2>/dev/null || echo "docker: absent"
          echo "== disk (/) ==";      df -h / | tail -1
          echo "== os ==";            grep -E '^PRETTY_NAME=' /etc/os-release || true
