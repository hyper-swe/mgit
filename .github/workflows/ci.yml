name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR stacked on a feature branch
  # got no checks at all while this read `branches: [main]`, and the evidence
  # the merge rule requires lived in hand-dispatched run ids nobody running
  # `gh pr checks` would see (MGIT-200). Pushes stay filtered to main.
  pull_request:
  # Lets a feature branch's jobs be verified before they ever reach main or a
  # PR -- added specifically to give the new libkrun-linux job (below) its
  # first real run, since push/pull_request alone never fire on this branch.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the toolchain to the one setup-go installs, and forbid Go from
  # downloading another. Without this, go.mod's `toolchain` directive makes
  # Go fetch golang.org/toolchain AS A MODULE into the module cache; setup-go
  # then caches that directory, and the next run's restore collides with the
  # toolchain setup-go itself installed -- `gtar: Cannot open: File exists`,
  # which is a hard job failure. Keep this in step with go.mod's toolchain
  # line and the go-version pins below. Refs: MGIT-118
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Run tests with race detector
        run: go test ./... -race -count=1

      - name: Run linter
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11.3

      - name: Run vulnerability check
        run: |
          # The install is a proxy.golang.org fetch; the scan that follows is
          # local. -t 120 is the floor: this step's worst success in CI history
          # is 19s (n=136). Refs: MGIT-143
            # pin-exempt: govulncheck floats on purpose — a pinned scanner stops finding new vulnerabilities; the fetch is guarded (MGIT-143) and the float is a recorded decision (MGIT-179)
          bash scripts/ci/guard-fetch.sh -t 120 -l govulncheck-install \
            -c none:'the module cache writes each download to a temp path and renames it only after verifying the checksum, so a failed fetch leaves nothing behind for the next attempt to trip over' -- \
            go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Every third-party fetch reachable from CI is guarded or a declared
      # exception carrying its reason. This is the tripwire that keeps that
      # true rather than merely stated -- a new bare `curl` in any workflow or
      # script fails here. The self-test proves the guard's three clauses
      # against a fetch that errors, one that hangs, and one that leaves a
      # corrupt artifact behind. Refs: MGIT-143
      - name: Fetch guard — inventory + the guard's own three clauses
        run: |
          bash scripts/ci/fetch-inventory.sh
          bash scripts/ci/guard-fetch-selftest.sh
          bash scripts/sandbox-image/prefetch-selftest.sh

      # Every build tool and action on a reproducible path is pinned, or its
      # float is declared at the site with a reason. The self-test proves the
      # check refuses each floating shape before its pass means anything.
      # Refs: MGIT-180, MGIT-179
      - name: Pinned tools — the tree, then the check's own refusals
        run: |
          bash scripts/ci/check-pinned-tools.sh
          bash scripts/ci/check-pinned-tools-selftest.sh

      # The pre-tag conditions of a release are one committed check, not a
      # scratchpad script that vanishes with a session (v0.6.6's cut script
      # tripped three of its own defects and was gone by the next release).
      # The self-test proves the check refuses each condition on fixture
      # repositories it builds under its own scratch root, accepts the one
      # shape a cut may have, and reports a check that cannot run as a loud
      # failure rather than a pass. Refs: MGIT-209
      - name: Release preflight — the check's own refusals
        run: bash scripts/ci/release-preflight-selftest.sh

      # Every target the release ships compiles on every PR, so a platform
      # break cannot reach a tag: a syscall.Kill in an untagged file broke the
      # Windows targets of mgit on main and nothing here noticed, because the
      # job built only on the runner's own platform (MGIT-198). The target list
      # is pinned to .goreleaser.yaml by TestCrossBuild_CoversEveryReleaseTarget.
      - name: Cross-build every release target
        run: bash scripts/ci/cross-build.sh

      - name: Build binary
        run: make build

      - name: Smoke test
        run: ./cmd/mgit/mgit --version

      - name: Test coverage
        run: make test-cover

  # The BACKSTOP for the MGIT-142 branch-scope tripwire, not the tripwire
  # itself. The guard's real position is the pre-push hook (scripts/hooks/
  # pre-push), which fires before the pull request exists; this job repeats it
  # for the pushes that skipped the hook -- a fresh clone that never ran `make
  # install-hooks`, or a `git push --no-verify`. It needs the full history and
  # every remote branch, because the question it answers is whether some OTHER
  # unmerged branch's commits are sitting underneath this one. Refs: MGIT-142
  branch-scope:
    name: Branch scope
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Fetch every branch, so an inherited one can be recognized
        run: git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Check the head branch's scope
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: go run ./scripts/branchguard --branch "origin/$HEAD_REF" --base origin/main

  # The libkrun backend is opt-in at build time on Linux (-tags libkrun) and
  # the default on macOS (ADR-010's GA backend split); the pure-Go `test` job
  # above never compiles its cgo binding on either platform. macOS 14 runner:
  # libkrun needs macOS 14+ and the libkrun/krun tap ships bottles for it (no
  # kernel compile). This is also where the tagged path is unit-tested with
  # a real linked libkrun; the Linux job below is build+vet only (see its own
  # comment for why). Refs: ADR-010, MGIT-61.8
  libkrun:
    name: libkrun backend (tagged build, macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      # Cache Homebrew's DOWNLOADS, not its installs. libkrun's dependency
      # virglrenderer is the one formula built FROM SOURCE, and it fetches its
      # tarball from gitlab.freedesktop.org -- so without this, every run of this
      # job depends on a third-party server being up. On 2026-08-15 that server
      # returned 504 for over half an hour and put main red three times with
      # nothing wrong in this repository.
      #
      # A stale cache is safe: brew verifies the checksum of anything it reuses,
      # so a corrupted or wrong-version entry fails the install rather than
      # building something unexpected. restore-keys lets an older entry serve a
      # newer formula's unchanged sources. Refs: MGIT-119
      - name: Cache Homebrew downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-${{ runner.os }}-libkrun-v1-${{ github.run_id }}
          restore-keys: |
            brew-downloads-${{ runner.os }}-libkrun-v1-

      # tap + trust + install, every network step guarded (retry, timeout,
      # precondition restore). The inline retry loop that used to live here
      # covered only `brew install` and existed only in this job; the same
      # three commands in release.yml had no retry at all, so the CDN outage
      # this absorbed on the PR path would still have taken a release down.
      # Refs: MGIT-143, MGIT-119
      - name: Install libkrun (bottled)
        run: bash scripts/ci/install-libkrun-brew.sh

      - name: Build, vet and test the tagged path
        # DYLD_FALLBACK_LIBRARY_PATH: libkrun dlopens libkrunfw by leaf name
        # (ADR-010 packaging finding).
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libkrun)/lib/pkgconfig"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix libkrunfw)/lib:$(brew --prefix libkrun)/lib"
          make test-libkrun   # includes check-libkrun-net (MGIT-61.14)

  # Proves `brew install` of the formula works for a user who does NOT have
  # libkrun -- the first-hour macOS install (MGIT-75).
  #
  # This job must never be merged into the `libkrun` job above, and nothing in
  # it may install libkrun. That job's very first step is `brew install
  # libkrun`, and a satisfied dependency is never loaded, so the failure this
  # job exists to catch is invisible there. That is exactly how the bug
  # shipped: `brew install --dry-run hyper-swe/tap/mgit` passed on the
  # developer machine that later found the breakage, because libkrun was
  # already installed on it. A separate runner with nothing on it is the
  # point, not an inefficiency.
  #
  # The check itself lives in a script rather than inline so that a developer
  # can run the runner's exact code against a scratch Homebrew prefix
  # (`BREW=... scripts/brew-install-no-libkrun.sh`) instead of against their
  # own libkrun-bearing machine. The script asserts libkrun's absence before
  # it concludes anything, so it fails loudly rather than passing vacuously if
  # this runner image ever starts shipping libkrun.
  # Refs: MGIT-75, MGIT-69, MGIT-70
  brew-install-no-libkrun:
    name: brew install without libkrun (first-hour macOS install)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - name: Install mgit from the repo formula on a libkrun-free runner
        run: scripts/brew-install-no-libkrun.sh

  # The macOS job above is the ONLY thing that compiled the libkrun cgo
  # binding until 2026-07-29, when a Linux-only build+link failure
  # (RTLD_DEFAULT needing _GNU_SOURCE on glibc; dlsym needing -ldl on
  # pre-2.34 glibc) went undetected because nothing in CI ever built the
  # Linux tagged path. This job closes that gap.
  #
  # Scope is deliberately build+vet ONLY: catching a compile/link regression
  # does not need a VM to boot, and this job is on the fast PR path. Whether a
  # libkrun VM actually boots on Linux is proven by the `sandbox-live-linux-
  # libkrun` job in e2e.yml, which does boot one on real KVM (MGIT-87). This
  # comment used to say hosted runners expose no /dev/kvm; that was measured to
  # be false (MGIT-78 on the host, MGIT-87 inside a container with the device
  # passed through), and the live gate exists because of it.
  #
  # Pinned to a `ubuntu:20.04` container image (not the job's own
  # `ubuntu-latest` host OS) because that is the toolchain this build recipe
  # was validated against: Ubuntu 20.04's own clang (10) lacks the libclang API
  # bindgen needs, so libclang-18 from `focal-updates` is installed explicitly.
  # (A from-source libkrunfw build was once reported to fail on Ubuntu 24.04;
  # re-measured 2026-08-11 it succeeds there, so 20.04 is now a consistency
  # choice with the live gate rather than a workaround.) Building from source
  # costs ~4-5 minutes; there is no Ubuntu package for libkrun or libkrunfw on
  # any release yet (see docs/adr/010, kept local/untracked).
  libkrun-linux:
    name: libkrun backend (tagged build+vet, Linux)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      # The ONLY apt before checkout, and the smallest: git (so the checkout
      # carries history), ca-certificates and curl. This was a DECLARED
      # EXCEPTION serving only clause 2, because the guard script arrives WITH
      # the checkout: an ordering problem, not a judgement against retrying.
      # The clauses are now served inline, so the exception is gone rather than
      # overruled: three attempts (clause 1), apt's state cleared between them
      # (clause 3), each bounded (clause 2), and each attempt prints when it
      # started and how it ended, so the log names every attempt made.
      # The bound is the MGIT-143 rule on this step's own history: this apt
      # (update + git ca-certificates curl, ubuntu:20.04) succeeded n=42 times
      # on 2026-09-23..24, worst 91 s; 4x is 364 s, up the ladder to 600 s.
      # That history is already slower than the 56 s worst the whole toolchain
      # install had over n=256 before it: the mirror moved, the rule did not.
      # Everything heavier is installed after checkout by
      # scripts/release/linux-build-prereqs.sh, through the guard.
      # Refs: MGIT-143, MGIT-144, MGIT-243
      # fetch-guard: runs before actions/checkout, so the guard script is not
      # on disk yet; its clauses are served inline below. Refs: MGIT-143
      - name: Bootstrap git (bounded, retried, before checkout)
        timeout-minutes: 32 # 3 attempts x 600 s + 45 s of backoff, rounded up
        run: |
          for attempt in 1 2 3; do
            echo "apt bootstrap: attempt $attempt/3 started $(date -u +%H:%M:%SZ): apt-get update + install git ca-certificates curl (bound 600s)"
            if timeout 600 sh -c 'apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends git ca-certificates curl'; then
              echo "apt bootstrap: ok on attempt $attempt at $(date -u +%H:%M:%SZ)"
              exit 0
            fi
            echo "apt bootstrap: attempt $attempt failed or hit its 600s bound at $(date -u +%H:%M:%SZ); clearing apt state before the next"
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/partial/*
            dpkg --configure -a || true
            sleep $((attempt * 15))
          done
          echo "apt bootstrap: all 3 attempts failed; the apt output above is the evidence"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build prerequisites (toolchains, guarded)
        # apt (the libkrun build toolchain incl. libclang-18 from focal-updates),
        # the pinned Go and rustup with the musl target, every fetch through the
        # guard: the same recipe the release's Linux daemon is built with.
        # Refs: MGIT-229, MGIT-143
        run: |
          bash scripts/release/linux-build-prereqs.sh
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The pinned kernel tarball, cached across runs.
      #
      # libkrunfw downloads ~145 MB from a third party before it compiles
      # anything, on every run. A transfer to a rented runner was therefore on
      # the critical path of the whole repository, and a network hiccup there
      # blocked an unrelated PR three times in a row. The tarball is PINNED, so
      # its identity is its content, so it is cacheable by construction; the
      # build verifies its digest whether the bytes came from the cache or the
      # network, so this can only make the run faster, never weaker.
      # Refs: MGIT-163, MGIT-147
      - name: Cache the pinned libkrunfw kernel tarball
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/mgit-libkrun
          key: libkrunfw-kernel-${{ hashFiles('scripts/sandbox-image/pins.env') }}

      - name: Build the PINNED libkrunfw + libkrun (NET=1; ~4-5 min)
        # The recipe moved into a script so a developer can run the runner's
        # exact build, and so the versions are PINNED in one place. It used to
        # clone `main` of both repos inline, which is how the first real Linux
        # boot attempt ended up on an upstream that had stubbed out
        # krun_set_workdir (MGIT-87). A build job that compiles against a
        # different library from the one the live gate boots proves less than
        # it appears to.
        # The cache directory is the one actions/cache above restores and
        # saves. It is expanded HERE, by the shell: a YAML env value is handed
        # to the step literally, and "~/.cache/…" made build-libkrun.sh store
        # the tarball under a directory named ~ while the real cache stayed
        # empty, so it never restored (MGIT-238).
        run: |
          export MGIT_LIBKRUN_CACHE="$HOME/.cache/mgit-libkrun"
          bash scripts/sandbox-image/build-libkrun.sh /usr/local

      - name: Build and vet the tagged path
        env:
          PKG_CONFIG_PATH: /usr/local/lib64/pkgconfig
          LIBRARY_PATH: /usr/local/lib64
          LD_LIBRARY_PATH: /usr/local/lib64
        # -buildvcs=false: this job never ships an artifact, so the VCS
        # stamping `go build` does by default (embedding commit info) buys
        # nothing here and is one more way for the step to fail for reasons
        # unrelated to the tagged libkrun path itself.
        run: |
          go build -buildvcs=false -tags libkrun ./...
          go vet -tags libkrun ./internal/sandboxd/backend/libkrun/ ./cmd/mgit-sandboxd/
