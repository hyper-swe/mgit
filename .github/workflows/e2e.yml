# Install-channel + posture e2e (MGIT-48).
#
# CI historically ran unit/integration tests from the repo checkout, where a
# dev-built mgit-sandboxd sits next to mgit and masks exactly the failures real
# users hit on a clean machine (two external trials failed on DISTRIBUTION, not
# the product). These jobs exercise what a user actually gets — an installed
# binary, no repo, both postures — and are reusable (workflow_call) so the
# release pipeline gates on them.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}
  # On-demand: re-run the live containment gate against a branch without
  # waiting for a release tag. Refs: MGIT-78
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Daemon-less posture + core loop + MCP surface, on a host with NO
  # mgit-sandboxd. This is the always-on gate; it needs no virtualization.
  posture:
    name: Posture (daemon-less core loop + MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build mgit only (no mgit-sandboxd — daemon-less posture)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/mgit" ./cmd/mgit/

      - name: Core-loop e2e (init/work/commit/status/squash→git apply/worktree/verify/audit)
        run: bash scripts/e2e/core_loop.sh "$RUNNER_TEMP/bin"

      - name: Course-correction e2e (rollback→fork→restore/cherry-pick→squash, append-only)
        run: bash scripts/e2e/course_correction.sh "$RUNNER_TEMP/bin"

      - name: Daemon-less posture e2e (honest wiring, run fails-closed with pointer)
        run: bash scripts/e2e/daemonless_posture.sh "$RUNNER_TEMP/bin"

      - name: REST posture e2e (real serve process, /api/v1 routes, serve+CLI lock coexistence)
        run: bash scripts/e2e/rest_posture.sh "$RUNNER_TEMP/bin"

      - name: MCP posture e2e (drive every registered tool via a real stdio client)
        env:
          MGIT_BIN: ${{ runner.temp }}/bin/mgit
        run: go run ./scripts/e2e/mcpdrive

  # Install-channel matrix: prove the documented install paths produce working
  # binaries. go install is validated on every run; the release-archive channel
  # is validated from goreleaser's own snapshot artifacts.
  install-channels:
    name: Install channel (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [go-install, release-archive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install via go install
        if: matrix.channel == 'go-install'
        run: |
          bin="$RUNNER_TEMP/gobin"; mkdir -p "$bin"
          GOBIN="$bin" go install ./cmd/mgit ./cmd/mgit-sandboxd
          test -x "$bin/mgit" || { echo "mgit not installed"; exit 1; }
          test -x "$bin/mgit-sandboxd" || { echo "mgit-sandboxd not installed by go install"; exit 1; }
          echo "BINDIR=$bin" >> "$GITHUB_ENV"

      - name: Build release archive (Linux) and extract
        if: matrix.channel == 'release-archive'
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          # Only the Linux builds — the darwin daemon is CGO/native (built on a
          # mac in release.yml), so it is excluded from this ubuntu snapshot.
          goreleaser build --snapshot --clean --skip=before \
            --id mgit --id mgit-sandboxd-linux --single-target
          bin="$RUNNER_TEMP/archbin"; mkdir -p "$bin"
          cp "$(find dist -type f -name mgit -perm -u+x | head -1)" "$bin/mgit"
          cp "$(find dist -type f -name mgit-sandboxd -perm -u+x | head -1)" "$bin/mgit-sandboxd"
          echo "BINDIR=$bin" >> "$GITHUB_ENV"

      - name: Core-loop e2e against the installed binaries
        run: bash scripts/e2e/core_loop.sh "$BINDIR"

  # LIVE Linux containment gate: real firecracker microVMs on real KVM.
  #
  # This job used to be "Sandbox posture (gated; skips without virtualization)"
  # and asserted the opposite of what is true: it stated GitHub-hosted runners
  # have no nested virtualization, built no mgit-sandboxd, and therefore only
  # ever exercised sandbox_posture.sh's SKIP branch — a green check that proved
  # nothing about containment. Measured 2026-08-10 on ubuntu-latest,
  # ubuntu-24.04 and ubuntu-22.04: /dev/kvm is present (root:kvm 0660, so the
  # udev rule below is what makes it usable by the `runner` user), KVM_CREATE_VM
  # succeeds, and the full firecracker battery boots and passes here. The
  # headline claim of the product is now gated by CI on every push, PR and
  # release instead of by the availability of one physical box. Refs: MGIT-78
  #
  # It fails LOUD in both directions that matter: a runner that stops offering
  # /dev/kvm fails the job rather than skipping, and a posture SKIP is treated
  # as a failure — a skip that reads as a pass is the exact defect this repo
  # keeps finding (the macOS libkrun gate, 2026-08-05).
  sandbox-live-linux:
    name: Sandbox LIVE (Linux/KVM firecracker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Require /dev/kvm (nested virtualization)
        run: |
          set -euo pipefail
          # /dev/kvm ships root:kvm 0660 and `runner` is not in the kvm group;
          # the static_node rule is what actually grants access.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm
          # Assert, do not skip: if the hosted runner class ever loses nested
          # virt, this gate must go red so the loss is noticed, not silently
          # degrade back into an unrun manual checklist item.
          [ -r /dev/kvm ] && [ -w /dev/kvm ] \
            || { echo "FATAL: /dev/kvm not usable — the Linux live gate cannot run"; exit 1; }

      - name: Install the pinned firecracker VMM
        run: |
          sudo bash scripts/sandbox-image/fetch-firecracker.sh amd64 /usr/local/bin/firecracker

      - name: Host tooling (mke2fs for worktree delivery, iptables for egress)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs iproute2 iptables

      - name: Build mgit + mgit-sandboxd (no -tags libkrun — Linux links firecracker)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/mgit" ./cmd/mgit/
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/mgit-sandboxd" ./cmd/mgit-sandboxd/

      - name: Build the guest image (pinned kernel + reproducible rootfs)
        run: |
          mkdir -p "$RUNNER_TEMP/guest"
          bash scripts/sandbox-image/fetch-kernel-fc.sh amd64 "$RUNNER_TEMP/guest/vmlinux"
          bash scripts/sandbox-image/build-rootfs.sh   amd64 "$RUNNER_TEMP/guest/rootfs.ext4"

      - name: Sandbox posture e2e — must PASS (live), a SKIP fails the job
        run: |
          set -uo pipefail
          # shellcheck source=scripts/sandbox-image/pins.env
          . scripts/sandbox-image/pins.env
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MGIT_GUEST_KERNEL="$RUNNER_TEMP/guest/vmlinux"
          export MGIT_GUEST_ROOTFS="$RUNNER_TEMP/guest/rootfs.ext4"
          # Without a cmdline the registered image boots a kernel with no root=
          # and no init=, and the only symptom is "guest vsock not ready".
          export MGIT_GUEST_CMDLINE="$FC_CMDLINE"
          bash scripts/e2e/sandbox_posture.sh "$RUNNER_TEMP/bin" 2>&1 | tee "$RUNNER_TEMP/posture.log"
          grep -q 'SANDBOX POSTURE E2E: PASS (live)' "$RUNNER_TEMP/posture.log" || {
            echo "FATAL: the posture gate did not pass LIVE (a SKIP is a failure here)"; exit 1; }

      # The sandbox CLI verbs an operator actually types. They were unit-only
      # until MGIT-88: unit tests exercise the service BENEATH the CLI, and this
      # project's defects keep landing in the gap between the two (MGIT-77,
      # MGIT-83, MGIT-65 were each green at the unit layer and broken for a
      # user). `status`, `list` and `remove` are what someone reaches for first
      # when a sandbox misbehaves, so a defect there surfaces at the worst
      # possible moment. Refs: MGIT-88
      - name: Sandbox CLI surface e2e (list/status/exec/shell/grants/remove)
        env:
          MGIT_GUEST_KERNEL: ${{ runner.temp }}/guest/vmlinux
          MGIT_GUEST_ROOTFS: ${{ runner.temp }}/guest/rootfs.ext4
        run: |
          set -uo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          export MGIT_GUEST_CMDLINE="$FC_CMDLINE"
          bash scripts/e2e/sandbox_cli_surface.sh "$RUNNER_TEMP/bin" 2>&1 | tee "$RUNNER_TEMP/cli.log"
          grep -q 'SANDBOX CLI SURFACE E2E: PASS (live)' "$RUNNER_TEMP/cli.log" || {
            echo "FATAL: the CLI surface gate did not pass LIVE (a SKIP is a failure here)"; exit 1; }
          # shell and grants are refused OFF Linux by documented platform gates
          # (KVM PTY transport; the Linux-only egress escalation stack). This IS
          # Linux with KVM, so both must have RUN -- if they report NOT SERVED
          # here, the capability regressed rather than being unavailable.
          if grep -q 'NOT SERVED on this backend' "$RUNNER_TEMP/cli.log"; then
            echo "FATAL: a verb reported NOT SERVED on the Linux/KVM gate, where both are expected to run"
            exit 1
          fi

      - name: Firecracker e2e — unprivileged half
        env:
          MGIT_TEST_KERNEL: ${{ runner.temp }}/guest/vmlinux
          MGIT_TEST_ROOTFS: ${{ runner.temp }}/guest/rootfs.ext4
          MGIT_E2E_GUEST_ROOTFS: ${{ runner.temp }}/guest/rootfs.ext4
        run: |
          set -uo pipefail
          go test ./internal/sandboxd/backend/firecracker/ -run 'TestE2E_' \
            -v -count=1 -timeout 30m 2>&1 | tee "$RUNNER_TEMP/fc-user.log"
          grep -q '^ok  ' "$RUNNER_TEMP/fc-user.log" || { echo "FATAL: firecracker e2e failed"; exit 1; }

      # The root half is where containment is actually proven: tap + iptables
      # REDIRECT (CAP_NET_ADMIN) is how this backend enforces egress, and the
      # MGIT-78 live-policy pair lives here.
      - name: Firecracker e2e — root-gated half (network, port publish, live policy)
        run: |
          set -uo pipefail
          # The guest probe is cross-compiled OUTSIDE sudo and handed over, so
          # the privileged run needs no toolchain of its own.
          mkdir -p "$RUNNER_TEMP/probe"
          (cd internal/sandboxd/backend/libkrun/testdata/netprobe &&
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/probe/netprobe" .)
          go test -c -o "$RUNNER_TEMP/fc.test" ./internal/sandboxd/backend/firecracker/
          sudo -E env PATH="$PATH" \
            MGIT_TEST_KERNEL="$RUNNER_TEMP/guest/vmlinux" \
            MGIT_TEST_ROOTFS="$RUNNER_TEMP/guest/rootfs.ext4" \
            MGIT_E2E_GUEST_ROOTFS="$RUNNER_TEMP/guest/rootfs.ext4" \
            MGIT_E2E_NETPROBE="$RUNNER_TEMP/probe/netprobe" \
            "$RUNNER_TEMP/fc.test" -test.run 'TestE2E_' -test.v -test.count=1 \
            -test.timeout 30m 2>&1 | tee "$RUNNER_TEMP/fc-root.log"
          grep -q '^PASS$' "$RUNNER_TEMP/fc-root.log" || { echo "FATAL: root-gated firecracker e2e failed"; exit 1; }

      - name: Assert the root half SKIPPED nothing
        run: |
          set -uo pipefail
          # With KVM + root + a guest image, every gate in this package is
          # satisfied, so a SKIP means a prerequisite silently went missing and
          # the suite quietly stopped proving anything.
          if grep -n -- '--- SKIP' "$RUNNER_TEMP/fc-root.log"; then
            echo "FATAL: a firecracker e2e skipped under root — the gate did not run"; exit 1
          fi
          echo "no skips in the root-gated battery"

      - name: Assert the MGIT-78 live-policy pair RAN and passed
        run: |
          set -uo pipefail
          # Named explicitly rather than trusted to the package result: these
          # two are the whole reason MGIT-78 exists, and their gates
          # (requireGuestImage + requireNetRoot) skip silently.
          for t in TestE2E_Firecracker_Revoke_KillsEstablishedFlow \
                   TestE2E_Firecracker_Revoke_DrainKeepsEstablishedFlow; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/fc-root.log" \
              || { echo "FATAL: $t did not PASS (skipped or failed)"; exit 1; }
          done
          echo "== MGIT-78 live-policy evidence =="
          grep -E 'revoke applied|drained revoke applied|hold probe|post-revoke flow refused|REAL VM PASS' \
            "$RUNNER_TEMP/fc-root.log" || true
