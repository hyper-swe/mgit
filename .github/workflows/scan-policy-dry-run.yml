name: Scan policy dry runs
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/scan-policy-dry-run.yml]
permissions:
  contents: read
jobs:
  policy:
    name: Policy dry run (${{ matrix.finding }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        finding: [excepted, planted]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare deterministic scanner
        env:
          FINDING: ${{ matrix.finding }}
        run: |
          fixture=$(mktemp -d)
          python3 - "$fixture" <<'PYTHON'
          import importlib.util, os, pathlib, sys
          spec = importlib.util.spec_from_file_location("fixtures", "scripts/ci/test_check_vulnerabilities.py")
          fixtures = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fixtures)
          findings = [(i, fixtures.MODULE, "v4.16.3") for i in ("GO-2026-6872", "GO-2026-6875")]
          if os.environ["FINDING"] == "planted":
              findings.append(("GO-2099-9999", fixtures.MODULE, "v4.16.3"))
          scanner = pathlib.Path(sys.argv[1]) / "govulncheck"
          scanner.write_text("#!/bin/sh\ncat <<'DATA'\n" + fixtures.stream(findings) + "\nDATA\n")
          scanner.chmod(0o755)
          PYTHON
          echo "$fixture" >> "$GITHUB_PATH"
      - name: Run vulnerability check
        run: python3 scripts/ci/check-vulnerabilities.py
      - name: Fetch guard — inventory + the guard's own three clauses
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ci/fetch-inventory.sh
          bash scripts/ci/guard-fetch-selftest.sh
          bash scripts/sandbox-image/prefetch-selftest.sh
          bash scripts/sandbox-image/guest-tools-selftest.sh
          bash scripts/sandbox-image/guest-tools-urls-selftest.sh
          bash scripts/sandbox-image/guest-base-selftest.sh
          bash scripts/sandbox-image/guest-debs-check-selftest.sh
          bash scripts/sandbox-image/guest-debs-repin-selftest.sh
          bash scripts/sandbox-image/guest-debs-gpg-selftest.sh --require

      - name: Tap formula — the check's own refusals, then the live tap
        if: ${{ !cancelled() }}
        env:
          MGIT_TAP_BRANCH: ""
        run: |
          bash scripts/ci/check-tap-formula-selftest.sh
          if [ -n "$MGIT_TAP_BRANCH" ]; then
            bash scripts/ci/check-tap-formula.sh --tap-url "https://raw.githubusercontent.com/hyper-swe/homebrew-tap/${MGIT_TAP_BRANCH}/Formula/mgit.rb"
          else
            bash scripts/ci/check-tap-formula.sh
          fi

      - name: Pinned tools — the tree, then the check's own refusals
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ci/check-pinned-tools.sh
          bash scripts/ci/check-pinned-tools-selftest.sh

      - name: Release preflight — the check's own refusals
        if: ${{ !cancelled() }}
        run: bash scripts/ci/release-preflight-selftest.sh
